# Сервис web: собранный фронт и прокси /api в backend (docs/CONVEYOR.md, раздел про docker compose).
# Маршруты кабинета — в хэше (/app#/bank), поэтому серверу нужны только /, /app и статика.
# Бэкенд пускает запись по cookie только с Origin из CORS_ORIGINS: в compose там должен быть адрес сайта, http://localhost:8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Имя backend ищем при запросе, а не при старте: web поднимается, даже если бэкенд ещё не готов
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        # Ответ чата ждёт модель: бэкенд сам обрывает её по таймауту, здесь — с запасом, как в Caddyfile бэкенда
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        # Доверенность и документы — до 5 МБ (contracts/conveyor.md)
        client_max_body_size 6m;
        # Только ошибки самого nginx (бэкенд не отвечает); ошибки бэкенда, вроде 502 AI_UNAVAILABLE, идут как есть
        error_page 502 504 = @backend_down;
    }

    # Бэкенд недоступен — ответ в формате ошибок контракта, фронт покажет его как обычную ошибку
    location @backend_down {
        default_type application/json;
        return 503 '{"error":{"code":"INTERNAL","message":"Сервис временно недоступен. Попробуйте позже."}}';
    }

    # add_header внутри location отменил бы заголовки выше, поэтому кэш — через expires (-1 = no-cache)
    location = /app { try_files /app.html =404; expires -1; }
    location = /app.html { expires -1; }
    # Ассеты подключаются относительными путями (base './'), со слэшем на конце они бы не нашлись
    location = /app/ { return 301 /app$is_args$args; }

    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
