name: xronix
services:
  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 220s
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    environment:
      MOCK_AI: ${MOCK_AI:-true}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:8001}
      CONSULT_CHAT: "true"
      SEED_DEMO: ${SEED_DEMO:-true}
      INTEGRATIONS_URL: http://integrations-mock:8002
      CORS_ORIGINS: ${CORS_ORIGINS:-https://xronix.ru}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      DATABASE_URL: sqlite:////srv/backend/data/xronix.db
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_DIR: /srv/backend/backups
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-7}
      BACKUP_TIMEOUT_SECONDS: ${BACKUP_TIMEOUT_SECONDS:-30}
      DB_MIN_FREE_MB: ${DB_MIN_FREE_MB:-100}
      AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-6}
      AI_GLOBAL_PER_MINUTE: ${AI_GLOBAL_PER_MINUTE:-30}
      AI_MAX_CONCURRENT: ${AI_MAX_CONCURRENT:-4}
      API_REQUESTS_PER_MINUTE: ${API_REQUESTS_PER_MINUTE:-120}
      AUTH_REQUESTS_PER_MINUTE: ${AUTH_REQUESTS_PER_MINUTE:-20}
    command: [uvicorn, 'app.main:create_app', --factory, --host, 0.0.0.0, --port, '8000', --proxy-headers, --forwarded-allow-ips, '*', --timeout-graceful-shutdown, '180']
    volumes:
      - backend_data:/srv/backend/data
      - backend_backups:/srv/backend/backups
    networks: [private, ai]
    depends_on:
      integrations-mock: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    pids_limit: 100
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  integrations-mock:
    build: ../../integrations-mock
    restart: unless-stopped
    networks: [private]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [public, private]
    depends_on:
      backend: {condition: service_healthy}
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  backend_data:
  backend_backups:
  caddy_data:
  caddy_config:
networks:
  public:
  private:
    internal: true
  ai:
    name: xronix_ai
